# /etc/tmpfiles.d/ina.conf -- runtime directories for INA v2 (systemd-tmpfiles --create)
#
# Root-only: written exclusively by /usr/local/sbin/ina-netctl (the privilege boundary).
d /run/ina      0750 root root -
d /var/lib/ina  0750 root root -
d /var/log/ina  0750 root root -
# Unprivileged MCP server: policy-guard decision log.
d /var/log/ina-mcp 0750 ina ina -

# /etc/dnsmasq.d/ina-ap.conf -- INA v2 DHCP and DNS on the client AP (ap0)
interface=ap0
bind-interfaces
listen-address=192.168.50.1

# DHCP pool (192.168.50.10 to 192.168.50.100, 12-hour lease)
dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,12h

# Per-device reservations generated from policy/devices.yaml by
# 'ina-netctl sync-devices' (re-read on SIGHUP; no restart needed).
# Gives each registered MAC its admin-assigned name (and fixed IP, if set),
# which is the name INA tools and the policy engine use.
dhcp-hostsfile=/etc/ina/dhcp-hosts

# Default gateway (option 3) and DNS server (option 6)
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1,8.8.8.8

dhcp-authoritative
log-dhcp

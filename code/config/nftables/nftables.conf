#!/usr/sbin/nft -f
# /etc/nftables.conf for the INA router.
#
# Do NOT add "flush ruleset": it would wipe unrelated tables (Docker, fail2ban).
# Each INA table is named and managed on its own.

table ip ina_nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip saddr 192.168.50.0/24 oifname "wlan0" masquerade
    }
}

# Client blocking / isolation / anti-spoofing (sets filled at runtime by ina-netctl).
include "/etc/nftables.d/ina-filter.nft"

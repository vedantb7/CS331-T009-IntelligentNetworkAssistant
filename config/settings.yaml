# System Configuration Settings
# NOTE: The settings defined here are initial placeholders.
# Implementation and final configuration structure will be defined in subsequent milestones.

app:
  name: "intelligent-network-assistant-v2"
  environment: "development"
  log_level: "INFO"

network:
  # Explicit Wi-Fi interface for AP mode (e.g., "wlp8s0" or "wlan1").
  # Set to null or leave empty to allow unambiguous automatic discovery of a dedicated non-uplink wireless interface.
  interface: null
  subnet: "192.168.10.1/24"

mcp_server:
  host: "127.0.0.1"
  port: 8000


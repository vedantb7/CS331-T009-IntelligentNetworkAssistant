# /etc/NetworkManager/conf.d/90-ina-unmanaged.conf
#
# NetworkManager must not manage the INA AP interface: if it does, it treats
# ap0 as a disconnected Wi-Fi client and strips the 192.168.50.1/24 address
# that ina-ap-interface.sh assigns, so dnsmasq and the MCP server cannot bind.
# wlan0 (the uplink to the hotspot) stays managed by NetworkManager.
[keyfile]
unmanaged-devices=interface-name:ap0;interface-name:ifb-ap0

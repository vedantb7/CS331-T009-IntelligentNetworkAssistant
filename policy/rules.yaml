# INA v2 rulebook (admin-owned).
#
# Anything not explicitly allowed is denied. Per-role permissions live in
# roles.yaml; this file holds what applies to everyone.

version: "3.0"
default_decision: deny

# Devices of these classes can never be changed by any role.
protected_classes: [protected]

# Device names (from devices.yaml) that are always protected, whatever their class.
protected_devices: [pi-gateway, admin-laptop, probe-laptop]

# MAC addresses that can never be blocked, limited, kicked or banned.
# Also read by network/wireless.py (load_protected_macs), so keep this key and
# keep MAC addresses out of the rest of this file.
protected_macs:
  - "aa:bb:cc:dd:ee:00"  # pi-gateway / ap0
  - "aa:bb:cc:dd:ee:01"  # admin-laptop
  - "aa:bb:cc:dd:ee:02"  # probe-laptop

# IP addresses that can never be targeted (the Pi router / gateway).
protected_ips: ["192.168.50.1"]

# Clients addressed by IP must be a host address in this subnet (docs/network.md).
managed_subnet: "192.168.50.0/24"

# Client names, exactly as in mcp_server/schemas.py CLIENT_REGEX (lower-case
# letters, digits and '-'). Anything else is rejected before any lookup, so a
# hostname cannot smuggle in text.
client_name:
  pattern: "[a-z0-9][a-z0-9-]{0,62}"

# Scope keywords accepted as a block_client / unblock_client target.
block_targets: [gateway, internet, all]

# Absolute limits no role may exceed, even if roles.yaml is edited carelessly.
# They match mcp_server/schemas.py (MIN/MAX_BANDWIDTH_KBIT, MAX_BAN_MINUTES).
bandwidth_kbit:
  hard_min: 256
  hard_max: 20000
ban_minutes:
  hard_max: 10080

# Free-text ban reason, as in mcp_server/schemas.py REASON_REGEX.
ban_reason:
  pattern: "[A-Za-z0-9 .,_-]{0,120}"

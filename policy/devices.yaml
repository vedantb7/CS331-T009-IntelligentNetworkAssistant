# Admin-owned device list: name -> MAC address -> class (and optional fixed IP).
# Classes: protected | staff | guest | unknown
# Replace the MACs with the real devices on the Pi network.
# Names must match rules.yaml client_name (lower-case letters, digits, '-').
# Devices NOT listed here can still be addressed by IP or MAC; they are then
# treated as class "unknown".

devices:
  - {name: pi-gateway,   mac: "aa:bb:cc:dd:ee:00", class: protected, ip: "192.168.50.1"}
  - {name: admin-laptop, mac: "aa:bb:cc:dd:ee:01", class: protected}
  - {name: probe-laptop, mac: "aa:bb:cc:dd:ee:02", class: protected}
  - {name: lab-laptop-3, mac: "aa:bb:cc:dd:ee:03", class: staff}
  - {name: guest-phone,  mac: "aa:bb:cc:dd:ee:04", class: guest}
